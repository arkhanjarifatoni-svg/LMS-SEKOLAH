
name: Build CBT Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CBT-Sekolah/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CBT-Sekolah

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
        gradle-version: '8.13'
      - name: Build APK
        run: |
          gradle --version
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CBT-Sekolah-debug-apk
          path: CBT-Sekolah/app/build/outputs/apk/debug/app-debug.apk
